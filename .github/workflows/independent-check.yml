name: Independent pinned image spot check
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: php2shell-image-verification
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Query independent PHP web SAPIs and collect package evidence
        run: python3 scripts/independent-check.py
      - name: Publish evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if test -f dist/data/independent-spot-check.json; then
            git add dist/data/independent-spot-check.json
            git commit -m 'Publish independent image spot check evidence'
            git push
          fi
